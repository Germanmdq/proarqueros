<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROARQUEROS</title><style>:root{--g:#31d22d;--i:#101510;--l:#dfe5df}*{box-sizing:border-box}body{margin:0;font-family:Arial;color:var(--i)}.nav{height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l)}.word{font-size:22px;font-weight:900;letter-spacing:-2px}.word span,.accent{color:var(--g)}.hero{padding:80px 7vw;background:#f5f7f4}.hero h1,.catalog h2{font-size:clamp(48px,8vw,105px);line-height:.8;letter-spacing:-.09em;margin:18px 0}.over{font-size:10px;font-weight:bold;letter-spacing:1.5px}.catalog{padding:70px 5vw}.search{width:100%;padding:15px;border:1px solid var(--i);margin:15px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--l);padding:12px;cursor:pointer}.card:hover{border-color:var(--g)}.slot{height:175px;background:#f4f7f4;border:1px dashed #aab5aa;display:grid;place-items:center;font-size:10px;color:#768176;text-transform:uppercase}.card h3{font-size:14px}.price{font-weight:bold;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.sheet{background:#fff;width:min(480px,100%);padding:30px;position:relative}.close{position:absolute;right:15px;top:12px;background:none;border:0;font-size:25px}.sheet h2{font-size:36px;letter-spacing:-2px;margin:10px 0}.sheet p{line-height:1.5;color:#566}.sizes{display:none;gap:8px;margin:20px 0}.sizes.show{display:flex}.sizes button{border:1px solid var(--i);background:white;width:45px;height:42px;font-weight:bold}.sizes button:hover{background:var(--g)}.foot{padding:30px 5vw;background:var(--i);color:#fff}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.slot{height:125px}.catalog{padding:50px 5vw}}</style><body><header class="nav"><b class="word">PRO<span> const s=`ZULU IV|135000;AXUM|135000;BASEL|112000;IMPERIO|112000;RIO|80000;MOLDES|80000;SPIDER|90000;AXUM LEGEND|135000;ZULU|135000;BASEL JUNIOR|73000;IMPERIO JUNIOR|73000;ZULU JUNIOR|64000;AXUM JUNIOR|64000;ARGENTINA JUNIOR|70000;BRAVO|105000;FIL CONTROL|105000;LANUSCA JOVEN|65000;GUARDIANO|45000;SUPREME|60000;DURBAN|65000;STRIKER|70000;BUSAN|90000;GOTIK|110000;TERMICA CON PROTECCION|53000;TERMICA SIN PROTECCION|50000;MEDIAS VGFC|10000;FURY LINEA ACADEMY|95000;KING|125000;FURY FORCEGRIP TOTAL BLACK|95000;FLEXIPANT 405|65000;PANTALON FULL PROTEC|55000;CALZA SAMURAI LARGA|98000;REMERA LYCRA SAMURAI|71000;ROYAL 3.0|65000;FELINE 20|104000;CONTAC SILVER GLUEPERINT|100000;PURE CONTAC PRIME FUSION|132000;ATTRAKT FREEGEL INFINITY|125000;ATTRAKT PRO FUSION ADVANCE|90000;POWERLINE ABSOLUTGRIP|141000;POWERLINE SOFT|76000;SCORPIUS UGT|140000;HORUS|135000;ARES|140000;ZEUS|130000;SHARK|90000;REX|90000;COBRA|60000;EAGLE|115000;HAWK|110000;COPA|110000;PREDATOR|140000;PEGASO NUMERO 4 ROJA|45000;FLASH|30000;CARDIF 3.0|55000;RODILLERAS REUSCH|32000;CANILLERAS FOX|20000;CINTA COBAN|6500;INFLADOR MUNICH|7500;BOLSO 6/8|31000;BOLSO 10/12|33000;JABON LIQUIDO|10000;ADHERENTE SUA|13000;LATEX LIQUIDO BLANCO|14000;SHORT NASSAU|15000;CALZA NASSAU|20000;MEDIAS FOX CLASICAS|16000;EVO 10 CESPED NATURAL|23000`;const d=s.split(';').map(x=>x.split('|'));const glove=n=>!/TERMICA|MEDIAS|PANTALON|CALZA|REMERA|BUZO|BOLSO|CANILLERA|CINTA|INFLADOR|JABON|ADHERENTE|LATEX|RODILLERA|PELOTA|PEGASO|FLASH|CARDIF|EVO|SUPERFLAY|ZENGA|FLEXIPANT|BERMUDA|MANGAS|CONJUNTO/.test(n);function render(){let a=d.filter(x=>x[0].toLowerCase().includes(q.value.toLowerCase()));count.textContent=a.length+' productos';grid.innerHTML=a.map(x=>'<article class="card" onclick="openProduct(\''+x[0].replaceAll("'",'')+'\',\''+x[1]+'\')"><div class="slot">Ver producto</div><h3>'+x[0]+'</h3><p class="price">$ '+Number(x[1]).toLocaleString('es-AR')+'</p></article>').join('')}function openProduct(n,p){let g=glove(n);kind.textContent=g?'GUANT
