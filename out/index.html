<!doctype html>
<html lang="es"><meta name="viewport" content="width=device-width"><title>PROARQUEROS</title>
<style>:root{--g:#31d22d;--i:#101510;--l:#dfe5df}*{box-sizing:border-box}body{margin:0;font-family:Arial;color:var(--i)}a{color:var(--i);font:700 11px Arial;text-decoration:none}.nav{height:76px;padding:0 5vw;display:flex;align-items:center;border-bottom:1px solid var(--l)}.word{font-size:22px;font-weight:900;letter-spacing:-2px}.word span,.accent{color:var(--g)}.hero{padding:90px 7vw;background:linear-gradient(90deg,rgba(245,247,244,.78),rgba(245,247,244,.34)),url('images/cancha-home.png') center/cover no-repeat}.hero h1,.catalog h2{font-size:clamp(48px,8vw,105px);letter-spacing:-.1em;line-height:.8;margin:15px 0}.catalog{padding:60px 5vw}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0}.filters button{border:1px solid var(--i);background:white;padding:10px 14px;font:700 11px Arial;cursor:pointer}.filters button.active,.filters button:hover{background:var(--g);border-color:var(--g)}.count{font-size:11px;color:#526052}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.card{border:1px solid var(--l);padding:12px;display:block}.card:hover{border-color:var(--g)}.slot{height:175px;background:#f4f7f4;border:1px dashed #aab5aa;display:grid;place-items:center;color:#778;text-transform:uppercase}.line{font-size:10px;color:#657065;margin:12px 0 3px;text-transform:uppercase}.card h3{font-size:14px;margin:0 0 7px}.price{font-size:13px;font-weight:bold;margin:0}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.slot{height:125px}.catalog{padding:45px 5vw}}</style>
<body><header class="nav"><b class="word">PRO<span>ARQUEROS</span></b></header><section class="hero"><h1>TU ARCO.<br><span class="accent">TU ZONA.</span><br>TU EQUIPO.</h1></section><section class="catalog" id="catalogo"><h2>TODO PARA<br><span class="accent">ATAJAR.</span></h2><div class="filters" id="filters"></div><p class="count" id="count"></p><div id="grid" class="grid"></div></section>
<script src="catalog-data.js"></script><script>const cats=['Todos','Guantes','Térmicas','Indumentaria','Pelotas','Accesorios','Calzado'],grid=document.querySelector('#grid'),count=document.querySelector('#count'),filters=document.querySelector('#filters');let active='Todos';function render(){let items=active==='Todos'?PRODUCTS:PRODUCTS.filter(x=>x.c===active);count.textContent=items.length+' productos';grid.innerHTML=items.map(x=>'<a class="card" href="producto.html?n='+encodeURIComponent(x.n)+'&p='+x.p+'"><div class="slot">Imagen próximamente</div><p class="line">'+x.l+'</p><h3>'+x.n+'</h3><p class="price">$ '+x.p.toLocaleString('es-AR')+'</p></a>').join('');filters.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.c===active))}filters.innerHTML=cats.map(c=>'<button data-c="'+c+'">'+c+'</button>').join('');filters.onclick=e=>{if(e.target.dataset.c){active=e.target.dataset.c;render()}};render();</script></body></html>
