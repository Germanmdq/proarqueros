<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PROARQUEROS</title><style>:root{--g:#31d22d;--i:#101510;--l:#dfe5df}*{box-sizing:border-box}body{margin:0;font-family:Arial;color:var(--i)}header{height:76px;padding:0 5vw;display:flex;align-items:center;border-bottom:1px solid var(--l)}a{color:var(--i);font-size:11px;font-weight:bold}.word{font-size:22px;font-weight:900;letter-spacing:-2px}.word span{color:var(--g)}main{max-width:1000px;margin:auto;padding:7vw 5vw;display:grid;grid-template-columns:1fr 1fr;gap:7vw}.slot{min-height:440px;background:#f4f7f4;border:1px dashed #aab5aa;display:grid;place-items:center;color:#778;font-size:10px}.name{font-size:clamp(42px,6vw,76px);line-height:.82;letter-spacing:-.09em;margin:20px 0}.sizes{display:flex;gap:8px}.sizes button{width:48px;height:45px;background:white;border:1px solid var(--i);font-weight:bold}.sizes button.active,.sizes button:hover,.add{background:var(--g)}.add,.wsp{margin-top:20px;width:100%;padding:16px;border:0;font-weight:bold;text-transform:uppercase;font-size:11px}.wsp{display:none;background:var(--i);color:white;text-align:center;text-decoration:none}@media(max-width:700px){main{display:block}.slot{min-height:260px;margin-bottom:30px}}</style><body><header><a class="word" href="index.html">PRO<span>ARQUEROS</span></a></header><main><div class="slot">Imagen del producto próximamente</div><div><a href="index.html">← VOLVER</a><p id="type"></p><h1 id="n" class="name"></h1><p id="desc"></p><div id="sizeWrap"><p><b>Elegí el talle</b></p><div class="sizes"><button onclick="talle(this)">5</button><button onclick="talle(this)">6</button><button onclick="talle(this)">7</button></div></div><h3 id="p"></h3><button class="add" onclick="add()">Agregar al carrito</button><a id="wsp" class="wsp" target="_blank">Enviar pedido por WhatsApp</a></div></main><script>let q=new URLSearchParams(location.search),t='',cat=q.get('c')||'Guantes',name=q.get('n')||'';n.textContent=name;p.textContent='$ '+Number(q.get('p')).toLocaleString('es-AR');type.textContent=cat.toUpperCase();const copy={Guantes:'Guantes de arquero pensados para entrenamiento y partido. Elegí el talle antes de agregar al carrito.','Térmicas':'Prenda térmica para acompañarte en entrenamientos y partidos. Consultanos por los talles y colores disponibles.',Indumentaria:'Indumentaria para arqueros, cómoda y resistente para entrenar y jugar. Consultanos por los talles y colores disponibles.',Pelotas:'Pelota para entrenamiento y juego. Consultanos por la disponibilidad y los modelos disponibles.',Accesorios:'Accesorio para complementar tu equipo de arquero. Consultanos por la disponibilidad y las opciones disponibles.'};desc.textContent=/MEDIA/i.test(name)?'Medias deportivas de alta calidad, pensadas para brindar comodidad y rendimiento durante el entrenamiento y el partido. Consultanos por los colores y talles disponibles.':(copy[cat]||'Producto PROARQUEROS. Consultanos por la disponibilidad y las opciones disponibles.');if(cat!=='Guantes')sizeWrap.style.display='none';function talle(b){document.querySelectorAll('.sizes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');t=b.textContent}function money(v){return '$ '+Number(v).toLocaleString('es-AR')}function add(){if(cat==='Guantes'&&!t)return alert('Elegí un talle');let c=JSON.parse(localStorage.getItem('proCart')||'[]');c.push({n:name,p:q.get('p'),t,cat,color:''});localStorage.setItem('proCart',JSON.stringify(c));let g=Object.values(c.reduce((a,x)=>{let k=[x.n,x.p,x.t,x.color||''].join('|');if(!a[k])a[k]={...x,qty:0};a[k].qty++;return a},{})),total=g.reduce((s,x)=>s+Number(x.p)*x.qty,0),details=g.map(x=>['• Producto: '+x.n,'  Color: '+(x.color||'Consultar colores disponibles'),'  Talle/Número: '+(x.t||'Consultar talles disponibles'),'  Cantidad: '+x.qty,'  Precio unitario: '+money(x.p),'  Subtotal: '+money(Number(x.p)*x.qty)].join('\n')).join('\n\n'),message='¡Hola! 👋 ¿Cómo están?\n\nMe interesa consultar la disponibilidad antes de realizar mi compra.\n\n🥊 Detalle de mi consulta:\n\n'+details+'\n\nTotal general: '+money(total)+'\n\n¿Podrían confirmarme la disponibilidad, los colores y los talles disponibles, junto con la información necesaria para concretar la compra?\n\n¡Muchas gracias! Quedo atento/a a su respuesta.';wsp.href='https://wa.me/5492236326323?text='+encodeURIComponent(message);wsp.style.display='block';wsp.textContent='Enviar pedido ('+c.length+') por WhatsApp'}</script></body></html>
