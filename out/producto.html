<!doctype html><html lang="es"><meta name="viewport" content="width=device-width"><title>PROARQUEROS</title><style>:root{--g:#31d22d;--i:#101510;--l:#dfe5df}*{box-sizing:border-box}body{margin:0;font-family:Arial;color:var(--i)}header{height:76px;padding:0 5vw;display:flex;align-items:center;border-bottom:1px solid var(--l)}a{color:var(--i);font-size:11px;font-weight:bold}.word{font-size:22px;font-weight:900;letter-spacing:-2px}.word span{color:var(--g)}main{max-width:1000px;margin:auto;padding:7vw 5vw;display:grid;grid-template-columns:1fr 1fr;gap:7vw}.slot{min-height:440px;background:#f4f7f4;border:1px dashed #aab5aa;display:grid;place-items:center;color:#778;font-size:10px}.name{font-size:clamp(42px,6vw,76px);line-height:.82;letter-spacing:-.09em;margin:20px 0}.sizes{display:flex;gap:8px}.sizes button{width:48px;height:45px;background:white;border:1px solid var(--i);font-weight:bold}.sizes button.active,.sizes button:hover,.add{background:var(--g)}.add,.wsp{margin-top:20px;width:100%;padding:16px;border:0;font-weight:bold;text-transform:uppercase;font-size:11px}.wsp{display:none;background:var(--i);color:white;text-align:center;text-decoration:none}@media(max-width:700px){main{display:block}.slot{min-height:260px;margin-bottom:30px}}</style><body><header><a class="word" href="index.html">PRO<span>ARQUEROS</span></a></header><main><div class="slot">Imagen del producto próximamente</div><div><a href="index.html">← VOLVER</a><p>GUANTE DE ARQUERO</p><h1 id="n" class="name"></h1><p>Guante de arquero para entrenamiento y partido. Elegí el talle antes de agregar al carrito.</p><div class="sizes"><button onclick="talle(this)">5</button><button onclick="talle(this)">6</button><button onclick="talle(this)">7</button></div><h3 id="p"></h3><button class="add" onclick="add()">Agregar al carrito</button><a id="wsp" class="wsp" target="_blank">Enviar pedido por WhatsApp</a></div></main><script>let q=new URLSearchParams(location.search),t='';n.textContent=q.get('n');p.textContent='$ '+Number(q.get('p')).toLocaleString('es-AR');function talle(b){document.querySelectorAll('.sizes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');t=b.textContent}function add(){if(!t)return alert('Elegí un talle');let c=JSON.parse(localStorage.getItem('proCart')||'[]');c.push({n:q.get('n'),p:q.get('p'),t});localStorage.setItem('proCart',JSON.stringify(c));let m='Hola PROARQUEROS, quiero consultar este pedido:%0A%0A'+c.map(x=>'• '+x.n+' — talle '+x.t+' — $ '+Number(x.p).toLocaleString('es-AR')).join('%0A');wsp.href='https://wa.me/5492236326323?text='+m;wsp.style.display='block';wsp.textContent='Enviar pedido ('+c.length+') por WhatsApp'}</script></body></html>
